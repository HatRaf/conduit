name: Live Voice iOS smoke

on:
  push:
    branches:
      - hermes/live-voice-spike
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-smoke:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out Conduit and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Voice and Hermes regression tests
        run: >-
          flutter test
          test/features/chat/voice_mode/chat_voice_mode_controller_test.dart
          test/features/hermes/hermes_desktop_transport_test.dart
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign
